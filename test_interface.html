<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Checker - Test Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .test-setup {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .test-setup h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .test-interface {
            display: none;
        }

        .test-interface.active {
            display: block;
        }

        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .test-info {
            flex: 1;
        }

        .test-info h3 {
            color: #333;
            margin-bottom: 5px;
        }

        .timer {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .violation-indicator {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .violation-indicator.warning {
            background: #f8d7da;
            border-color: #dc3545;
        }

        .violation-count {
            font-size: 18px;
            font-weight: bold;
            color: #dc3545;
        }

        .question-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .question {
            margin-bottom: 20px;
        }

        .question-text {
            color: #333;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .question-number {
            color: #667eea;
            font-weight: bold;
            display: inline-block;
            margin-right: 10px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .option input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
        }

        .option label {
            flex: 1;
            cursor: pointer;
            margin: 0;
        }

        .fullscreen-warning {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            display: none;
        }

        .fullscreen-warning.show {
            display: flex;
        }

        .fullscreen-modal {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
        }

        .fullscreen-modal h2 {
            color: #dc3545;
            margin-bottom: 15px;
        }

        .fullscreen-modal p {
            color: #666;
            margin-bottom: 20px;
        }

        .status-message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 20px;
            }

            .test-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .content {
                padding: 20px;
            }
        }

        /* Fullscreen styling */
        .test-interface:-webkit-full-screen {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 20px;
            background: white;
        }

        .test-interface:fullscreen {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 20px;
            background: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Student Performance Checker</h1>
            <p>Online Assessment Platform with Fullscreen Monitoring</p>
        </div>

        <div class="content">
            <!-- Setup Phase -->
            <div class="test-setup" id="setupPhase">
                <h2>Enter Test Details</h2>
                <div class="form-group">
                    <label for="testId">Test ID:</label>
                    <input type="number" id="testId" placeholder="Enter test ID" value="1">
                </div>
                <div class="form-group">
                    <label for="studentId">Student ID:</label>
                    <input type="number" id="studentId" placeholder="Enter student ID" value="1">
                </div>
                <div class="form-group">
                    <label for="studentName">Your Name:</label>
                    <input type="text" id="studentName" placeholder="Enter your full name">
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="startTest()">Start Test (Fullscreen)</button>
                    <button class="btn-secondary" onclick="viewInstructions()">Instructions</button>
                </div>
            </div>

            <!-- Test Interface -->
            <div class="test-interface" id="testInterface">
                <div class="status-message" id="statusMessage"></div>

                <div class="test-header">
                    <div class="test-info">
                        <h3 id="testTitle">Loading...</h3>
                        <p id="testDescription"></p>
                    </div>
                    <div class="timer" id="timer">--:--</div>
                </div>

                <div class="violation-indicator" id="violationIndicator">
                    <div>
                        ⚠️ <strong>Fullscreen Violations:</strong>
                        <span class="violation-count" id="violationCount">0</span> / 3
                    </div>
                    <button class="btn-secondary" onclick="exitTest()">Exit Test</button>
                </div>

                <div id="questionsContainer"></div>

                <div class="button-group" style="margin-top: 30px;">
                    <button class="btn-primary" onclick="submitTest()">Submit Test</button>
                    <button class="btn-secondary" onclick="saveDraft()">Save Draft</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Warning Modal -->
    <div class="fullscreen-warning" id="fullscreenWarning">
        <div class="fullscreen-modal">
            <h2>⚠️ Left Fullscreen Mode</h2>
            <p>You have exited the fullscreen mode. Please return to fullscreen to continue the test.</p>
            <p>Violations: <strong id="violationWarningCount">0</strong> / 3</p>
            <button class="btn-primary" onclick="reenterFullscreen()">Return to Fullscreen</button>
        </div>
    </div>

    <script>
        // Global state
        let testState = {
            testId: null,
            studentId: null,
            resultId: null,
            questions: [],
            answers: {},
            violations: 0,
            maxViolations: 3,
            isFullscreen: false,
            startTime: null,
            timeLimit: 60, // minutes
            apiUrl: 'http://localhost:8080/api/v1'
        };

        // Start test
        async function startTest() {
            const testId = document.getElementById('testId').value;
            const studentId = document.getElementById('studentId').value;
            const studentName = document.getElementById('studentName').value;

            if (!testId || !studentId || !studentName) {
                showStatus('Please fill in all fields', 'error');
                return;
            }

            testState.testId = parseInt(testId);
            testState.studentId = parseInt(studentId);

            // Enter fullscreen
            const container = document.getElementById('testInterface');
            try {
                await container.requestFullscreen();
                testState.isFullscreen = true;

                // Load test and start
                await loadTest();
                startTestSession();
            } catch (error) {
                showStatus('Fullscreen not available: ' + error.message, 'error');
            }
        }

        // Load test questions
        async function loadTest() {
            try {
                const response = await fetch(`${testState.apiUrl}/tests/${testState.testId}/questions`);
                if (!response.ok) throw new Error('Failed to load test');

                testState.questions = await response.json();
                renderQuestions();
            } catch (error) {
                showStatus('Error loading test: ' + error.message, 'error');
            }
        }

        // Start test session
        async function startTestSession() {
            try {
                const response = await fetch(`${testState.apiUrl}/tests/${testState.testId}/start`, {
                    method: 'POST'
                });

                if (!response.ok) throw new Error('Failed to start test');

                const result = await response.json();
                testState.resultId = result.id;
                testState.startTime = Date.now();

                // Show interface and setup monitoring
                document.getElementById('setupPhase').style.display = 'none';
                document.getElementById('testInterface').classList.add('active');

                setupFullscreenMonitoring();
                startTimer();
            } catch (error) {
                showStatus('Error starting test: ' + error.message, 'error');
            }
        }

        // Render questions
        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = testState.questions.map((q, idx) => `
                <div class="question-container">
                    <div class="question-text">
                        <span class="question-number">Q${idx + 1}:</span>
                        ${q.question_text}
                    </div>
                    ${renderAnswerOptions(q, idx)}
                </div>
            `).join('');
        }

        // Render answer options
        function renderAnswerOptions(question, idx) {
            if (question.question_type === 'multiple_choice') {
                return `
                    <div class="options">
                        <label class="option">
                            <input type="radio" name="q${idx}" value="A" onchange="recordAnswer(${question.id}, 'A')">
                            <label>${question.option_a}</label>
                        </label>
                        <label class="option">
                            <input type="radio" name="q${idx}" value="B" onchange="recordAnswer(${question.id}, 'B')">
                            <label>${question.option_b}</label>
                        </label>
                        <label class="option">
                            <input type="radio" name="q${idx}" value="C" onchange="recordAnswer(${question.id}, 'C')">
                            <label>${question.option_c}</label>
                        </label>
                        <label class="option">
                            <input type="radio" name="q${idx}" value="D" onchange="recordAnswer(${question.id}, 'D')">
                            <label>${question.option_d}</label>
                        </label>
                    </div>
                `;
            }
            return '';
        }

        // Record answer
        function recordAnswer(questionId, answer) {
            testState.answers[questionId] = answer;
        }

        // Fullscreen monitoring
        function setupFullscreenMonitoring() {
            document.addEventListener('fullscreenchange', handleFullscreenChange);
            document.addEventListener('visibilitychange', handleVisibilityChange);
            document.addEventListener('keydown', handleKeyPress);
        }

        function handleFullscreenChange() {
            if (!document.fullscreenElement && testState.isFullscreen) {
                recordViolation();
            }
        }

        function handleVisibilityChange() {
            if (document.hidden && testState.isFullscreen) {
                recordViolation();
            }
        }

        function handleKeyPress(e) {
            if (testState.isFullscreen && e.key === 'Escape') {
                e.preventDefault();
            }
        }

        // Record violation
        async function recordViolation() {
            testState.violations++;
            updateViolationIndicator();

            try {
                await fetch(`${testState.apiUrl}/tests/${testState.testId}/results/${testState.resultId}/violation`, {
                    method: 'POST'
                });
            } catch (error) {
                console.error('Error recording violation:', error);
            }

            if (testState.violations >= testState.maxViolations) {
                failTest();
            } else {
                showFullscreenWarning();
            }
        }

        // Update violation indicator
        function updateViolationIndicator() {
            document.getElementById('violationCount').textContent = testState.violations;
            document.getElementById('violationWarningCount').textContent = testState.violations;

            const indicator = document.getElementById('violationIndicator');
            if (testState.violations >= testState.maxViolations - 1) {
                indicator.classList.add('warning');
            }
        }

        // Show fullscreen warning
        function showFullscreenWarning() {
            document.getElementById('fullscreenWarning').classList.add('show');
        }

        // Reenter fullscreen
        async function reenterFullscreen() {
            document.getElementById('fullscreenWarning').classList.remove('show');
            const container = document.getElementById('testInterface');
            try {
                await container.requestFullscreen();
            } catch (error) {
                console.error('Error entering fullscreen:', error);
            }
        }

        // Submit test
        async function submitTest() {
            // Save all answers first
            const promises = Object.entries(testState.answers).map(([qId, answer]) =>
                fetch(`${testState.apiUrl}/tests/${testState.testId}/results/${testState.resultId}/answer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question_id: parseInt(qId),
                        answer_choice: answer
                    })
                })
            );

            await Promise.all(promises);

            // Submit test
            try {
                const response = await fetch(
                    `${testState.apiUrl}/tests/${testState.testId}/results/${testState.resultId}/submit`,
                    { method: 'POST' }
                );

                if (response.ok) {
                    const result = await response.json();
                    showResults(result);
                } else {
                    showStatus('Error submitting test', 'error');
                }
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        // Show results
        function showResults(result) {
            const message = result.was_failed_for_violation
                ? `❌ TEST FAILED\nReason: Fullscreen violations (${result.fullscreen_violations})`
                : `✅ TEST SUBMITTED\nScore: ${result.score.toFixed(1)} / ${result.max_score}\nPercentage: ${result.percentage.toFixed(1)}%`;

            alert(message);
            exitFullscreen();
        }

        // Save draft
        function saveDraft() {
            showStatus('Draft saved automatically', 'success');
        }

        // Exit test
        function exitTest() {
            if (confirm('Are you sure you want to exit the test? Your answers will be lost.')) {
                exitFullscreen();
            }
        }

        // Exit fullscreen
        function exitFullscreen() {
            document.exitFullscreen().catch(() => {});
            window.location.href = '/';
        }

        // Fail test
        function failTest() {
            alert(`❌ TEST FAILED!\nYou exceeded the maximum fullscreen violations (${testState.maxViolations})`);
            exitFullscreen();
        }

        // Timer
        function startTimer() {
            const interval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - testState.startTime) / 1000);
                const remaining = Math.max(0, testState.timeLimit * 60 - elapsed);

                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;

                document.getElementById('timer').textContent =
                    `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

                if (remaining === 0) {
                    clearInterval(interval);
                    submitTest();
                }
            }, 1000);
        }

        // Show status
        function showStatus(message, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = `status-message ${type}`;
            setTimeout(() => el.className = 'status-message', 3000);
        }

        // View instructions
        function viewInstructions() {
            alert(`📋 TEST INSTRUCTIONS:\n\n1. Enter fullscreen mode\n2. Answer all questions\n3. Do not exit fullscreen (max 3 violations)\n4. Submit when ready\n5. You will see your score immediately`);
        }
    </script>
</body>
</html>
