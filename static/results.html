<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results — PerformanceIQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--primary:#6366f1;--primary-light:#818cf8;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--dark:#0f172a;--dark-2:#1e293b;--dark-3:#334155;--gray:#94a3b8;--white:#fff;--gradient-1:linear-gradient(135deg,#6366f1,#8b5cf6);}
        body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}

        .results-container{max-width:650px;width:100%;animation:fadeIn 0.6s ease;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

        /* Score Card */
        .score-card{text-align:center;background:var(--dark-2);border:1px solid rgba(99,102,241,0.15);border-radius:24px;padding:3rem;margin-bottom:1.5rem;position:relative;overflow:hidden;}
        .score-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--gradient-1);}

        .logo{font-weight:800;font-size:1rem;background:var(--gradient-1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2rem;display:inline-block;}

        .score-circle{width:160px;height:160px;border-radius:50%;margin:0 auto 1.5rem;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;}
        .score-circle svg{position:absolute;top:0;left:0;width:100%;height:100%;transform:rotate(-90deg);}
        .score-circle circle{fill:none;stroke-width:8;stroke-linecap:round;}
        .score-circle .bg{stroke:var(--dark-3);}
        .score-circle .progress{stroke:var(--success);transition:stroke-dashoffset 1.5s ease;stroke-dasharray:440;stroke-dashoffset:440;}
        .score-circle .percent{font-size:2.5rem;font-weight:900;position:relative;z-index:2;}
        .score-circle .label{font-size:0.8rem;color:var(--gray);position:relative;z-index:2;}

        .score-details{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;margin-top:1.5rem;}
        .detail-item{background:rgba(15,23,42,0.5);border-radius:12px;padding:1rem;}
        .detail-item .val{font-size:1.3rem;font-weight:800;}
        .detail-item .lbl{font-size:0.75rem;color:var(--gray);text-transform:uppercase;letter-spacing:0.05em;margin-top:0.2rem;}

        /* Status badges */
        .status-badge{display:inline-flex;align-items:center;gap:0.5rem;padding:0.5rem 1.5rem;border-radius:50px;font-weight:700;font-size:1rem;margin-bottom:1rem;}
        .status-pass{background:rgba(16,185,129,0.15);color:var(--success);border:1px solid rgba(16,185,129,0.3);}
        .status-fail{background:rgba(239,68,68,0.15);color:var(--danger);border:1px solid rgba(239,68,68,0.3);}
        .status-violation{background:rgba(239,68,68,0.15);color:var(--danger);border:1px solid rgba(239,68,68,0.3);}

        .result-title{font-size:1.6rem;font-weight:800;margin-bottom:0.3rem;}
        .result-subtitle{color:var(--gray);font-size:0.95rem;margin-bottom:1.5rem;}

        /* Violations card */
        .violations-card{background:var(--dark-2);border:1px solid rgba(99,102,241,0.1);border-radius:16px;padding:1.5rem;margin-bottom:1.5rem;}
        .violations-card h3{font-size:0.95rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:0.5rem;}
        .violation-bar{display:flex;gap:0.5rem;margin-bottom:0.5rem;}
        .v-dot{width:40px;height:8px;border-radius:4px;background:var(--dark-3);}
        .v-dot.used{background:var(--danger);}
        .v-info{font-size:0.85rem;color:var(--gray);}

        /* Answers */
        .answers-card{background:var(--dark-2);border:1px solid rgba(99,102,241,0.1);border-radius:16px;padding:1.5rem;margin-bottom:1.5rem;}
        .answers-card h3{font-size:0.95rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:0.5rem;}
        .answer-item{display:flex;align-items:center;gap:1rem;padding:0.75rem;border-radius:10px;margin-bottom:0.5rem;background:rgba(15,23,42,0.5);border:1px solid rgba(99,102,241,0.06);}
        .answer-item .a-num{min-width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700;}
        .answer-item .a-num.correct{background:rgba(16,185,129,0.15);color:var(--success);}
        .answer-item .a-num.wrong{background:rgba(239,68,68,0.15);color:var(--danger);}
        .answer-item .a-text{flex:1;font-size:0.85rem;}
        .answer-item .a-status{font-size:0.8rem;font-weight:600;}

        /* Back link */
        .back-link{text-align:center;margin-top:1rem;}
        .back-link a{color:var(--primary-light);text-decoration:none;font-weight:600;font-size:0.95rem;transition:color 0.3s;}
        .back-link a:hover{color:var(--white);}

        .loading{text-align:center;padding:4rem;}
        .spinner{width:40px;height:40px;border:3px solid var(--dark-3);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem;}
        @keyframes spin{to{transform:rotate(360deg);}}
    </style>
</head>
<body>

<div class="results-container">
    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="color:var(--gray);">Loading your results...</p>
    </div>

    <!-- Results Content -->
    <div id="resultsContent" style="display:none;">
        <!-- Score Card -->
        <div class="score-card">
            <div class="logo">PerformanceIQ</div>

            <div id="statusBadge"></div>
            <h2 class="result-title" id="resultTitle">Exam Results</h2>
            <p class="result-subtitle" id="resultSubtitle">Here's how you performed</p>

            <div class="score-circle">
                <svg viewBox="0 0 160 160">
                    <circle class="bg" cx="80" cy="80" r="70"/>
                    <circle class="progress" id="progressCircle" cx="80" cy="80" r="70"/>
                </svg>
                <div class="percent" id="percentText">0%</div>
                <div class="label">Score</div>
            </div>

            <div class="score-details">
                <div class="detail-item">
                    <div class="val" id="scoreVal">0/0</div>
                    <div class="lbl">Points</div>
                </div>
                <div class="detail-item">
                    <div class="val" id="answeredVal">0</div>
                    <div class="lbl">Answered</div>
                </div>
                <div class="detail-item">
                    <div class="val" id="timeVal">—</div>
                    <div class="lbl">Duration</div>
                </div>
            </div>
        </div>

        <!-- Violations -->
        <div class="violations-card" id="violationsCard">
            <h3><i class="fas fa-shield-halved" style="color:var(--warning);"></i> Fullscreen Violations</h3>
            <div class="violation-bar" id="violationBar"></div>
            <div class="v-info" id="violationInfo"></div>
        </div>

        <!-- Answers Breakdown -->
        <div class="answers-card" id="answersCard">
            <h3><i class="fas fa-list-check" style="color:var(--primary-light);"></i> Answer Breakdown</h3>
            <div id="answersList"></div>
        </div>

        <div class="back-link">
            <a href="/"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>
</div>

<script>
const API = '';
const resultId = window.location.pathname.split('/').pop();

document.addEventListener('DOMContentLoaded', loadResults);

async function loadResults() {
    try {
        const res = await fetch(`${API}/api/v1/take-test/results/${resultId}`);
        if (!res.ok) throw new Error('Result not found');
        const result = await res.json();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('resultsContent').style.display = 'block';

        // Status
        const statusEl = document.getElementById('statusBadge');
        if (result.was_failed_for_violation) {
            statusEl.innerHTML = '<div class="status-badge status-violation"><i class="fas fa-ban"></i> DISQUALIFIED — Fullscreen Violations</div>';
        } else if (result.status === 'failed') {
            statusEl.innerHTML = '<div class="status-badge status-fail"><i class="fas fa-times-circle"></i> FAILED</div>';
        } else if (result.status === 'completed') {
            if (result.percentage >= 60) {
                statusEl.innerHTML = '<div class="status-badge status-pass"><i class="fas fa-check-circle"></i> PASSED</div>';
            } else {
                statusEl.innerHTML = '<div class="status-badge status-fail"><i class="fas fa-times-circle"></i> FAILED</div>';
            }
        } else {
            statusEl.innerHTML = `<div class="status-badge" style="background:rgba(99,102,241,0.15);color:var(--primary-light);border:1px solid rgba(99,102,241,0.3);"><i class="fas fa-spinner"></i> ${result.status.toUpperCase()}</div>`;
        }

        // Score circle
        const pct = Math.round(result.percentage);
        document.getElementById('percentText').textContent = pct + '%';
        const circle = document.getElementById('progressCircle');
        const circumference = 2 * Math.PI * 70;
        circle.style.strokeDasharray = circumference;
        const offset = circumference - (pct / 100) * circumference;
        setTimeout(() => {
            circle.style.strokeDashoffset = offset;
            circle.style.stroke = pct >= 60 ? 'var(--success)' : 'var(--danger)';
        }, 100);

        // Details
        document.getElementById('scoreVal').textContent = `${result.score}/${result.max_score}`;
        document.getElementById('answeredVal').textContent = result.answers?.length || 0;

        if (result.started_at && result.completed_at) {
            const dur = Math.round((new Date(result.completed_at) - new Date(result.started_at)) / 60000);
            document.getElementById('timeVal').textContent = dur + ' min';
        }

        // Violations bar
        const maxV = 3; // default
        const bar = document.getElementById('violationBar');
        let dots = '';
        for (let i = 0; i < maxV; i++) {
            dots += `<div class="v-dot ${i < result.fullscreen_violations ? 'used' : ''}"></div>`;
        }
        bar.innerHTML = dots;
        document.getElementById('violationInfo').textContent =
            `${result.fullscreen_violations} of ${maxV} violations recorded` +
            (result.was_failed_for_violation ? ' — TEST FAILED DUE TO VIOLATIONS' : '');

        // Answers
        const list = document.getElementById('answersList');
        if (result.answers && result.answers.length > 0) {
            list.innerHTML = result.answers.map((a, i) => `
                <div class="answer-item">
                    <div class="a-num ${a.is_correct ? 'correct' : 'wrong'}">${i+1}</div>
                    <div class="a-text">Answer: <strong>${a.answer_choice || a.answer_text || '—'}</strong></div>
                    <div class="a-status" style="color:${a.is_correct ? 'var(--success)' : 'var(--danger)'};">
                        ${a.is_correct ? '✓ Correct' : '✗ Wrong'} (${a.points_earned} pts)
                    </div>
                </div>
            `).join('');
        } else {
            list.innerHTML = '<p style="color:var(--gray);font-size:0.9rem;text-align:center;">No answers recorded</p>';
        }

    } catch(e) {
        document.getElementById('loading').innerHTML = `
            <div style="font-size:3rem;color:var(--danger);margin-bottom:1rem;"><i class="fas fa-exclamation-triangle"></i></div>
            <h2>Result Not Found</h2>
            <p style="color:var(--gray);margin-top:0.5rem;">This result does not exist or has been removed.</p>
            <a href="/" style="color:var(--primary-light);margin-top:1rem;display:inline-block;">← Back to Home</a>
        `;
    }
}
</script>
</body>
</html>
