<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPlatform — Admin Dashboard</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f0e17;color:#fff;min-height:100vh;}
        .navbar{display:flex;align-items:center;justify-content:space-between;padding:15px 30px;background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.08);}
        .navbar .brand{font-size:20px;font-weight:700;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .navbar .user-info{display:flex;align-items:center;gap:15px;}
        .navbar .role-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff;}
        .navbar .logout-btn{padding:8px 16px;border:1px solid rgba(255,255,255,0.2);border-radius:8px;background:transparent;color:#fff;cursor:pointer;font-size:13px;}
        .navbar .logout-btn:hover{background:rgba(255,255,255,0.1);}
        .content{max-width:1200px;margin:30px auto;padding:0 20px;}
        h2{font-size:26px;margin-bottom:25px;font-weight:700;}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:30px;}
        .stat-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:25px;}
        .stat-card .label{font-size:13px;color:#888;margin-bottom:8px;}
        .stat-card .value{font-size:32px;font-weight:700;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .stat-card .sub{font-size:12px;color:#666;margin-top:5px;}
        .section{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:25px;margin-bottom:25px;}
        .section h3{font-size:18px;margin-bottom:15px;color:#ccc;}
        .quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
        .action-btn{padding:15px 20px;border:1px solid rgba(255,255,255,0.1);border-radius:10px;background:rgba(255,255,255,0.04);color:#fff;cursor:pointer;font-size:14px;transition:all 0.2s;text-align:left;}
        .action-btn:hover{background:rgba(102,126,234,0.15);border-color:rgba(102,126,234,0.3);}
        .action-btn .icon{font-size:24px;margin-bottom:8px;}
        .action-btn .name{font-weight:600;}
        .action-btn .desc{font-size:12px;color:#888;margin-top:3px;}
        table{width:100%;border-collapse:collapse;}
        th{text-align:left;padding:10px 12px;font-size:12px;color:#888;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.08);}
        td{padding:12px;font-size:14px;border-bottom:1px solid rgba(255,255,255,0.04);}
        .loading{text-align:center;padding:40px;color:#666;}
        .api-link{color:#667eea;text-decoration:none;font-size:13px;}
        .api-link:hover{text-decoration:underline;}
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="brand">🎓 EduPlatform</div>
        <div class="user-info">
            <span id="user-name"></span>
            <span class="role-badge">ADMIN</span>
            <button class="logout-btn" onclick="logout()">Chiqish</button>
        </div>
    </nav>

    <div class="content">
        <h2>📊 Admin Dashboard</h2>

        <div class="stats" id="stats">
            <div class="stat-card"><div class="label">Foydalanuvchilar</div><div class="value" id="s-users">—</div><div class="sub">Jami</div></div>
            <div class="stat-card"><div class="label">O'qituvchilar</div><div class="value" id="s-teachers">—</div></div>
            <div class="stat-card"><div class="label">Talabalar</div><div class="value" id="s-students">—</div></div>
            <div class="stat-card"><div class="label">Fanlar</div><div class="value" id="s-subjects">—</div></div>
            <div class="stat-card"><div class="label">Topshiriqlar</div><div class="value" id="s-assignments">—</div></div>
            <div class="stat-card"><div class="label">Yechimlar</div><div class="value" id="s-submissions">—</div></div>
        </div>

        <div class="section">
            <h3>⚡ Tezkor amallar</h3>
            <div class="quick-actions">
                <button class="action-btn" onclick="window.open('/docs','_blank')">
                    <div class="icon">📋</div><div class="name">API Documentation</div><div class="desc">Swagger UI — barcha endpointlar</div>
                </button>
                <button class="action-btn" onclick="goTo('/dashboard/users')">
                    <div class="icon">👥</div><div class="name">Foydalanuvchilar</div><div class="desc">User'larni boshqarish</div>
                </button>
                <button class="action-btn" onclick="goTo('/dashboard/subjects')">
                    <div class="icon">📚</div><div class="name">Fanlar</div><div class="desc">Fan yaratish va boshqarish</div>
                </button>
                <button class="action-btn" onclick="goTo('/dashboard/leaderboard')">
                    <div class="icon">🏆</div><div class="name">Leaderboard</div><div class="desc">Reyting jadvali</div>
                </button>
            </div>
        </div>

        <div class="section">
            <h3>👥 So'nggi foydalanuvchilar</h3>
            <table>
                <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Status</th></tr></thead>
                <tbody id="users-table"><tr><td colspan="5" class="loading">Yuklanmoqda...</td></tr></tbody>
            </table>
        </div>
    </div>

<script>
const TOKEN=localStorage.getItem('token');
const USER=JSON.parse(localStorage.getItem('user')||'null');
if(!TOKEN||!USER||USER.role!=='admin'){window.location.href='/';throw new Error('redirect');}
document.getElementById('user-name').textContent=USER.full_name||USER.username;

async function api(path){
    const r=await fetch(path,{headers:{'Authorization':'Bearer '+TOKEN}});
    if(r.status===401){logout();return null;}
    return r.json();
}
function logout(){localStorage.clear();window.location.href='/';}
function goTo(p){window.location.href=p;}

// Load dashboard data
(async()=>{
    try{
        const dash=await api('/api/v1/dashboard/admin');
        if(dash){
            document.getElementById('s-users').textContent=dash.total_users||0;
            document.getElementById('s-teachers').textContent=dash.total_teachers||0;
            document.getElementById('s-students').textContent=dash.total_students||0;
            document.getElementById('s-subjects').textContent=dash.total_subjects||0;
            document.getElementById('s-assignments').textContent=dash.total_assignments||0;
            document.getElementById('s-submissions').textContent=dash.total_submissions||0;
        }
    }catch(e){console.log('Dashboard API error',e);}

    try{
        const users=await api('/api/v1/users/?skip=0&limit=10');
        const tb=document.getElementById('users-table');
        if(users&&users.length){
            tb.innerHTML=users.map(u=>`<tr><td>${u.id}</td><td>${u.username}</td><td>${u.email}</td><td>${u.role}</td><td>${u.is_active?'✅':'❌'}</td></tr>`).join('');
        }else{tb.innerHTML='<tr><td colspan="5">Hech kim yo\'q</td></tr>';}
    }catch(e){console.log('Users API error',e);}
})();
</script>
</body>
</html>
