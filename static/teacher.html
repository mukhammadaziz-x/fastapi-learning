<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPlatform — Teacher Dashboard</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f0e17;color:#fff;min-height:100vh;}
        .navbar{display:flex;align-items:center;justify-content:space-between;padding:15px 30px;background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.08);}
        .navbar .brand{font-size:20px;font-weight:700;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .navbar .user-info{display:flex;align-items:center;gap:15px;}
        .navbar .role-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;background:linear-gradient(135deg,#2ed573,#1e90ff);color:#fff;}
        .navbar .logout-btn{padding:8px 16px;border:1px solid rgba(255,255,255,0.2);border-radius:8px;background:transparent;color:#fff;cursor:pointer;font-size:13px;}
        .content{max-width:1200px;margin:30px auto;padding:0 20px;}
        h2{font-size:26px;margin-bottom:25px;font-weight:700;}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:30px;}
        .stat-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:25px;}
        .stat-card .label{font-size:13px;color:#888;margin-bottom:8px;}
        .stat-card .value{font-size:32px;font-weight:700;background:linear-gradient(135deg,#2ed573,#1e90ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .section{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:25px;margin-bottom:25px;}
        .section h3{font-size:18px;margin-bottom:15px;color:#ccc;}
        .quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
        .action-btn{padding:15px 20px;border:1px solid rgba(255,255,255,0.1);border-radius:10px;background:rgba(255,255,255,0.04);color:#fff;cursor:pointer;font-size:14px;transition:all 0.2s;text-align:left;}
        .action-btn:hover{background:rgba(46,213,115,0.15);border-color:rgba(46,213,115,0.3);}
        .action-btn .icon{font-size:24px;margin-bottom:8px;}
        .action-btn .name{font-weight:600;}
        .action-btn .desc{font-size:12px;color:#888;margin-top:3px;}
        table{width:100%;border-collapse:collapse;}
        th{text-align:left;padding:10px 12px;font-size:12px;color:#888;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.08);}
        td{padding:12px;font-size:14px;border-bottom:1px solid rgba(255,255,255,0.04);}
        .grade{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;}
        .grade-DISTINCTION{background:rgba(46,213,115,0.2);color:#2ed573;}
        .grade-MERIT{background:rgba(30,144,255,0.2);color:#1e90ff;}
        .grade-PASS{background:rgba(255,165,0,0.2);color:#ffa502;}
        .grade-FAIL{background:rgba(255,71,87,0.2);color:#ff4757;}
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="brand">🎓 EduPlatform</div>
        <div class="user-info">
            <span id="user-name"></span>
            <span class="role-badge">TEACHER</span>
            <button class="logout-btn" onclick="logout()">Chiqish</button>
        </div>
    </nav>
    <div class="content">
        <h2>👨‍🏫 Teacher Dashboard</h2>

        <div class="stats">
            <div class="stat-card"><div class="label">Mening fanlarim</div><div class="value" id="s-subjects">—</div></div>
            <div class="stat-card"><div class="label">Topshiriqlar</div><div class="value" id="s-assignments">—</div></div>
            <div class="stat-card"><div class="label">Talabalar</div><div class="value" id="s-students">—</div></div>
            <div class="stat-card"><div class="label">Tekshirish kutmoqda</div><div class="value" id="s-pending">—</div></div>
        </div>

        <div class="section">
            <h3>⚡ Tezkor amallar</h3>
            <div class="quick-actions">
                <button class="action-btn" onclick="window.open('/docs','_blank')"><div class="icon">📋</div><div class="name">API Docs</div><div class="desc">Swagger orqali boshqarish</div></button>
                <button class="action-btn" onclick="goTo('/dashboard/subjects')"><div class="icon">📚</div><div class="name">Fanlarim</div><div class="desc">Fan yaratish / ko'rish</div></button>
                <button class="action-btn" onclick="goTo('/dashboard/assignments')"><div class="icon">📝</div><div class="name">Topshiriqlar</div><div class="desc">Test va vazifalar</div></button>
                <button class="action-btn" onclick="goTo('/dashboard/leaderboard')"><div class="icon">🏆</div><div class="name">Reyting</div><div class="desc">Leaderboard ko'rish</div></button>
            </div>
        </div>

        <div class="section">
            <h3>📚 Mening fanlarim</h3>
            <table>
                <thead><tr><th>Fan nomi</th><th>Kod</th><th>Tur</th><th>Talabalar</th></tr></thead>
                <tbody id="subjects-table"><tr><td colspan="4">Yuklanmoqda...</td></tr></tbody>
            </table>
        </div>
    </div>
<script>
const TOKEN=localStorage.getItem('token');
const USER=JSON.parse(localStorage.getItem('user')||'null');
if(!TOKEN||!USER||USER.role!=='teacher'){window.location.href='/';throw new Error('redirect');}
document.getElementById('user-name').textContent=USER.full_name||USER.username;
async function api(p){const r=await fetch(p,{headers:{'Authorization':'Bearer '+TOKEN}});if(r.status===401){logout();}return r.json();}
function logout(){localStorage.clear();window.location.href='/';}
function goTo(p){window.location.href=p;}

(async()=>{
    try{
        const dash=await api('/api/v1/dashboard/teacher');
        if(dash){
            document.getElementById('s-subjects').textContent=dash.total_subjects||0;
            document.getElementById('s-assignments').textContent=dash.total_assignments||0;
            document.getElementById('s-students').textContent=dash.total_students||0;
            document.getElementById('s-pending').textContent=dash.pending_reviews||0;
        }
    }catch(e){}
    try{
        const subs=await api('/api/v1/subjects/');
        const tb=document.getElementById('subjects-table');
        if(subs&&subs.length){
            tb.innerHTML=subs.map(s=>`<tr><td>${s.name}</td><td>${s.code||''}</td><td>${s.default_exam_type||'—'}</td><td>${s.enrolled_count||0}</td></tr>`).join('');
        }else{tb.innerHTML='<tr><td colspan="4">Hali fan yo\'q. Swagger (/docs) orqali fan yarating.</td></tr>';}
    }catch(e){}
})();
</script>
</body>
</html>
