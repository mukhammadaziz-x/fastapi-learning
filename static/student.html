<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPlatform — Student Dashboard</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f0e17;color:#fff;min-height:100vh;}
        .navbar{display:flex;align-items:center;justify-content:space-between;padding:15px 30px;background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.08);}
        .navbar .brand{font-size:20px;font-weight:700;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .navbar .user-info{display:flex;align-items:center;gap:15px;}
        .navbar .role-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;background:linear-gradient(135deg,#ffa502,#ff6b6b);color:#fff;}
        .navbar .logout-btn{padding:8px 16px;border:1px solid rgba(255,255,255,0.2);border-radius:8px;background:transparent;color:#fff;cursor:pointer;font-size:13px;}
        .content{max-width:1200px;margin:30px auto;padding:0 20px;}
        h2{font-size:26px;margin-bottom:25px;font-weight:700;}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:30px;}
        .stat-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:25px;}
        .stat-card .label{font-size:13px;color:#888;margin-bottom:8px;}
        .stat-card .value{font-size:32px;font-weight:700;background:linear-gradient(135deg,#ffa502,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .stat-card .sub{font-size:12px;color:#666;margin-top:5px;}
        .section{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:25px;margin-bottom:25px;}
        .section h3{font-size:18px;margin-bottom:15px;color:#ccc;}
        .quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
        .action-btn{padding:15px 20px;border:1px solid rgba(255,255,255,0.1);border-radius:10px;background:rgba(255,255,255,0.04);color:#fff;cursor:pointer;font-size:14px;transition:all 0.2s;text-align:left;}
        .action-btn:hover{background:rgba(255,165,2,0.15);border-color:rgba(255,165,2,0.3);}
        .action-btn .icon{font-size:24px;margin-bottom:8px;}
        .action-btn .name{font-weight:600;}
        .action-btn .desc{font-size:12px;color:#888;margin-top:3px;}
        table{width:100%;border-collapse:collapse;}
        th{text-align:left;padding:10px 12px;font-size:12px;color:#888;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.08);}
        td{padding:12px;font-size:14px;border-bottom:1px solid rgba(255,255,255,0.04);}
        .rank-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:14px;font-weight:700;background:linear-gradient(135deg,#ffa502,#ff6b6b);color:#fff;}
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="brand">🎓 EduPlatform</div>
        <div class="user-info">
            <span id="user-name"></span>
            <span class="role-badge">STUDENT</span>
            <button class="logout-btn" onclick="logout()">Chiqish</button>
        </div>
    </nav>
    <div class="content">
        <h2>👨‍🎓 Student Dashboard</h2>

        <div class="stats">
            <div class="stat-card"><div class="label">Umumiy ball</div><div class="value" id="s-score">—</div></div>
            <div class="stat-card"><div class="label">Reyting o'rni</div><div class="value" id="s-rank">—</div></div>
            <div class="stat-card"><div class="label">Bajarilgan</div><div class="value" id="s-completed">—</div></div>
            <div class="stat-card"><div class="label">O'rtacha %</div><div class="value" id="s-avg">—</div></div>
            <div class="stat-card"><div class="label">Streak 🔥</div><div class="value" id="s-streak">—</div><div class="sub">kunlik</div></div>
        </div>

        <div class="section">
            <h3>⚡ Tezkor amallar</h3>
            <div class="quick-actions">
                <button class="action-btn" onclick="goTo('/dashboard/assignments')"><div class="icon">📝</div><div class="name">Topshiriqlarim</div><div class="desc">Yechish uchun testlar</div></button>
                <button class="action-btn" onclick="goTo('/dashboard/leaderboard')"><div class="icon">🏆</div><div class="name">Leaderboard</div><div class="desc">Reyting jadvali</div></button>
                <button class="action-btn" onclick="goTo('/dashboard/results')"><div class="icon">📊</div><div class="name">Natijalarim</div><div class="desc">Barcha natijalar</div></button>
                <button class="action-btn" onclick="window.open('/docs','_blank')"><div class="icon">📋</div><div class="name">API</div><div class="desc">Developer mode</div></button>
            </div>
        </div>

        <div class="section">
            <h3>📋 So'nggi natijalar</h3>
            <table>
                <thead><tr><th>Topshiriq</th><th>Ball</th><th>%</th><th>Baho</th><th>Sana</th></tr></thead>
                <tbody id="results-table"><tr><td colspan="5">Yuklanmoqda...</td></tr></tbody>
            </table>
        </div>
    </div>
<script>
const TOKEN=localStorage.getItem('token');
const USER=JSON.parse(localStorage.getItem('user')||'null');
if(!TOKEN||!USER||USER.role!=='student'){window.location.href='/';throw new Error('redirect');}
document.getElementById('user-name').textContent=USER.full_name||USER.username;
async function api(p){const r=await fetch(p,{headers:{'Authorization':'Bearer '+TOKEN}});if(r.status===401){logout();}return r.json();}
function logout(){localStorage.clear();window.location.href='/';}
function goTo(p){window.location.href=p;}
function gradeColor(g){const m={'DISTINCTION':'#2ed573','MERIT':'#1e90ff','PASS':'#ffa502','FAIL':'#ff4757'};return m[g]||'#888';}

(async()=>{
    try{
        const a=await api('/api/v1/analytics/my');
        if(a){
            document.getElementById('s-score').textContent=a.total_score||0;
            document.getElementById('s-rank').textContent=a.current_rank||'—';
            document.getElementById('s-completed').textContent=a.assignments_completed||0;
            document.getElementById('s-avg').textContent=(a.average_percentage||0).toFixed(1);
            document.getElementById('s-streak').textContent=a.streak_days||0;
        }
    }catch(e){}

    try{
        const subs=await api('/api/v1/submissions/my');
        const tb=document.getElementById('results-table');
        if(subs&&subs.length){
            tb.innerHTML=subs.slice(0,10).map(s=>`<tr>
                <td>#${s.assignment_id}</td>
                <td>${s.score||0}/${s.max_score||0}</td>
                <td>${(s.percentage||0).toFixed(1)}%</td>
                <td><span style="color:${gradeColor(s.grade)}">${s.grade||'—'}</span></td>
                <td>${s.submitted_at?new Date(s.submitted_at).toLocaleDateString():'—'}</td>
            </tr>`).join('');
        }else{tb.innerHTML='<tr><td colspan="5">Hali natijalar yo\'q</td></tr>';}
    }catch(e){}
})();
</script>
</body>
</html>
